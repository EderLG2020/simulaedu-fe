# CI del frontend (monorepo pnpm + Turborepo): lint, typecheck, tests, knip y build en cada push
# a main y en cada PR. Ver simulaedu-be/docs/12-ci-cd.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Vite 8 / Vitest 4 / TypeScript 6 requieren Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint incluye los limites entre capas y features (eslint-plugin-boundaries).
      - run: pnpm lint
      - run: pnpm typecheck
      # Incluye las pruebas de arquitectura (ArchUnitTS) de cada app.
      - run: pnpm test
      # Codigo, exports y dependencias sin uso (knip), comparado con knip.baseline.txt.
      - run: pnpm knip
      - name: Build (tsc -b + vite build)
        run: pnpm build
